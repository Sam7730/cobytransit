name: Validate CobyTransit
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node --version && npm test && node scripts/check-data.mjs
      - name: Create a portable manifest for build validation
        run: |
          mkdir -p .openai
          printf '%s\n' '{"d1":null,"r2":"BUCKET"}' > .openai/hosting.json
      - run: npm run build
