name: Check upstream transit data
on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 scripts/import-gtfs.py && node scripts/check-data.mjs
      - name: Report changes for review
        run: |
          if git diff --quiet -- web/assets/transit.json data/feed-manifest.json; then
            echo 'No upstream changes detected.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Transit source changed. Review the agency pages and new data before release.' >> "$GITHUB_STEP_SUMMARY"
            git diff --stat >> "$GITHUB_STEP_SUMMARY"
          fi
